<body>
    <main>
    <div class="form-container">
        <form id="form">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="The name for your Order" required>

            <label for="email">E-Mail:</label>
            <input type="email" name="email" id="email" placeholder="your E-mail address" required>

            <label for="number">Phone number:</label>
            <input type="tel" name="phonenumber" id="phonenumber" placeholder="your phonenumber" required>

            <label for="comment">Comment:</label>
            <textarea id="comment" name="comment" rows="4"></textarea>

            <label for="flavors">Choose your favorite flavor</label>
            <select name="flavors" id="flavors">
                <option value="pistacio">pistacio latte</option>
                <option value="hazelnut latte">hazelnut latte</option>
                <option value="peacan latte">peacan latte</option>
</select>
                <input type="radio" name="reason" id="coffee" required> 
                <label for="coffee">Coffee Order</label>
                <input type="radio" name="reason" id="employment" required>
                <label for="employment">I would like to work here</label>

<button type="submit">submit</button>
          
        </form>

<p id="thank-you-message"></p>
